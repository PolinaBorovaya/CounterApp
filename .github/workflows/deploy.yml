name: Deploy Task to GitHub Pages

on:
  push:
    branches:
      - 'task*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract branch name
        id: branch
        run: echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_PATH: /${{ github.event.repository.name }}/${{ steps.branch.outputs.name }}/

      - name: Deploy to gh-pages subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: ${{ steps.branch.outputs.name }}
          clean: false